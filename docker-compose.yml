services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    # @feature-bff-start
    depends_on:
      - bff
    # @feature-bff-end
    ports:
      - '8088:80'
  # @feature-bff-start
  bff:
    profiles: ['bff', 'auth']
    build:
      context: .
      dockerfile: docker/bff.Dockerfile
    env_file:
      - apps/bff/.env.example
    environment:
      NODE_ENV: development
      # @feature-auth-start
      SESSION_STORE: redis
      REDIS_URL: redis://redis:6379
      OIDC_ISSUER_URL: http://keycloak:8080/realms/app
      OIDC_REDIRECT_URI: http://localhost:8088/api/auth/callback
      OIDC_POST_LOGOUT_REDIRECT_URI: http://localhost:8088/
      # @feature-auth-end
    ports:
      - '3001:3001'
    # @feature-auth-start
    depends_on:
      - redis
      - keycloak
    # @feature-auth-end
  # @feature-bff-end
  # @feature-auth-start
  redis:
    profiles: ['auth']
    image: redis:8-alpine
    ports:
      - '6379:6379'
  keycloak:
    profiles: ['auth']
    image: quay.io/keycloak/keycloak:26.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: 'true'
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
    ports:
      - '8080:8080'
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import
  # @feature-auth-end
